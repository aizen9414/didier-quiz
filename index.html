<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz 70 ans — compat</title>
<meta name="theme-color" content="#ff4d6d">
<style>
  body{{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff7fb}}
  .wrap{{max-width:860px;margin:0 auto;padding:18px}}
  .card{{background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:14px;margin:10px 0}}
  .qtext{{font-weight:800;margin-bottom:6px}}
  .choice{{display:block;padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0}}
  .timerwrap{{height:10px;background:#f3f4f6;border-radius:999px;overflow:hidden;margin:6px 0 2px}}
  .timerbar{{height:100%;background:#f59e0b;width:100%}}
  button.primary{{padding:12px;border:0;border-radius:12px;background:#ff4d6d;color:#fff;font-weight:800;width:100%}}
  .note{{color:#6b7280}}
</style>
</head>
<body>
<noscript><div class="wrap"><div class="card">⚠️ Ton navigateur a désactivé JavaScript : active-le pour lancer le quiz.</div></div></noscript>
<div class="wrap">
  <div id="screen-start" class="card">
    <h2>🎉 Quiz — Mode chrono 15s (compat)</h2>
    <p>Si le bouton ci-dessous ne marche pas, utilise <b>“Démarrer (compat)”</b>.</p>
    <button id="btnStart" class="primary">Démarrer</button>
    <div style="height:8px"></div>
    <button onclick="window.__startCompat && window.__startCompat()" class="primary">Démarrer (compat)</button>
  </div>
  <div id="screen-quiz" class="card" style="display:none">
    <div class="timerwrap"><div id="timer" class="timerbar"></div></div>
    <div id="qText" class="qtext"></div>
    <div id="choices"></div>
    <button id="btnLock" class="primary">Valider</button>
    <div id="feedback" class="note"></div>
  </div>
  <div id="screen-end" class="card" style="display:none">
    <h2>Résultat</h2>
    <div id="finalScore"></div>
    <button id="btnReplay" class="primary">Rejouer</button>
  </div>
</div>

<script>
(function(){{
  console.log("Quiz compat init");
  const QUESTIONS = [{"q": "En quelle année est-il né ?", "choices": ["1954", "1955", "1956", "1957"]}, {"q": "Quel est son deuxième prénom ?", "choices": ["Maurice", "Georges", "Marcel", "Robert"]}, {"q": "Quel est son signe astrologique ?", "choices": ["Verseau", "Bélier", "Cancer", "Balance"]}, {"q": "Quel a été l’entraîneur de son équipe de foot préférée ?", "choices": ["Arsène Wenger", "Aimé Jacquet", "Guy Roux", "Luis Fernandez"]}, {"q": "S’il devait choisir entre match de foot et un bon repas…", "choices": ["Le match", "Le repas", "Les deux devant la télé avec un plateau bien garni"]}, {"q": "Son plat préféré c’est sûrement :", "choices": ["Un bon cassoulet", "Une entrecôte frites", "Un gros plat de pâtes", "Tout ce qui se mange et se ressert"]}, {"q": "Devant la télé il est plutôt ?", "choices": ["Je monte le son en douce (fermez vos gueules)", "Roi de la zapette", "À s’endormir… « mais non je ne dors pas »", "Râler à tout va"]}, {"q": "Quel genre de programme il regarde le plus à la télé ?", "choices": ["Tous les sports qui existent", "Film romantique de l’après-midi (pour une bonne sieste)", "Chaîne info en continu", "Programme pour retrouver sa jeunesse"]}, {"q": "Son plus grand rêve de footballeur…", "choices": ["Marquer un but au Stade de France", "Être sélectionné en équipe de France vétéran", "Jouer un match sans se faire mal aux genoux", "Rester assis et regarder les autres jouer"]}, {"q": "En cuisine il est connu pour ?", "choices": ["Son célèbre barbecue « il y a que moi qui me lève »", "Son plat signature : le gratin de choux-fleurs au flan", "Son talent pour goûter et dire « c’est bon mais… »", "Finir son assiette et dire… « C’est tout ! »"]}, {"q": "Il supporte…", "choices": ["L’équipe locale (depuis toujours… ou pas 😂)", "Le club qui gagne selon la saison", "Personne : il critique tout le monde mais regarde tous les matchs", "Le club de ses petits-enfants (ah mince ils ne font pas de foot)"]}, {"q": "À quel âge il a eu son premier enfant ?", "choices": ["22", "23", "24", "25"]}, {"q": "En tant que papa/papi il est :", "choices": ["Toujours partant pour une petite balade en forêt", "Accompagne fièrement ses petits-enfants dans leurs activités", "Toujours présent", "Un papa/papi en or… un peu rouillé mais toujours aimant"]}];
  const TIME_PER_Q = 15;
  let idx=0, score=0, timer=null, tLeft=TIME_PER_Q, locked=false;

  function $ (id){{ return document.getElementById(id); }}
  function show(id){{ ["screen-start","screen-quiz","screen-end"].forEach(x=>$(x).style.display="none"); $(id).style.display="block"; }}

  function render(){{ 
    const q = QUESTIONS[idx];
    $("qText").textContent = (idx+1)+") "+q.q;
    const ch = $("choices"); ch.innerHTML="";
    (q.choices || []).forEach((c,i)=>{{ 
      const label = document.createElement("label"); label.className="choice";
      const input = document.createElement("input"); input.type="radio"; input.name="ans"; input.value=i;
      label.appendChild(input); label.appendChild(document.createTextNode(" "+c));
      ch.appendChild(label);
    }});
    $("feedback").textContent="";
    locked=false; tLeft=TIME_PER_Q; tick();
    if (timer) clearInterval(timer);
    timer=setInterval(()=>{{ tLeft--; tick(); if(tLeft<=0) lock(); }}, 1000);
  }}
  function tick(){{ 
    const pct = Math.max(0, Math.min(100, Math.round(100*tLeft/TIME_PER_Q)));
    $("timer").style.width = pct+"%";
  }}
  function lock(){{ 
    if(locked) return; locked=true; if(timer) clearInterval(timer);
    const sel = document.querySelector('input[name="ans"]:checked');
    if(sel) score++;
    $("feedback").textContent = sel? "✅ Réponse enregistrée" : "⏳ Temps écoulé";
    setTimeout(next, 500);
  }}
  function next(){{ 
    idx++; if(idx>=QUESTIONS.length) return end();
    render();
  }}
  function end(){{ 
    show("screen-end");
    $("finalScore").textContent = "Score: "+score+" / "+QUESTIONS.length;
  }}
  function start(){{ 
    try {{ show("screen-quiz"); render(); }} catch(e) {{ console.error(e); alert("Erreur de démarrage: "+e.message); }}
  }}
  window.__startCompat = start;

  function bind(){{ 
    var btnStart = $("btnStart"); if(btnStart) btnStart.addEventListener("click", start);
    var btnLock = $("btnLock"); if(btnLock) btnLock.addEventListener("click", lock);
    var btnReplay = $("btnReplay"); if(btnReplay) btnReplay.addEventListener("click", function(){{ idx=0; score=0; show("screen-start"); }});
  }}

  if(document.readyState==="loading"){{ 
    document.addEventListener("DOMContentLoaded", bind);
  }} else {{ 
    bind();
  }}
}})();
</script>
</body>
</html>
